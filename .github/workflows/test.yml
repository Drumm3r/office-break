name: Unit Tests

on:
  push:
    branches: [main, develop, release]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Run lint
        run: ./gradlew lintDebug

      - name: Build release APK (for tooling-leak guard)
        run: ./gradlew assembleRelease

      - name: Verify release APK has no debug tooling classes
        run: |
          release_apk=$(find app/build/outputs/apk/release -name '*.apk' -print -quit)
          if [ -z "$release_apk" ]; then
            echo "::error::No release APK found"
            exit 1
          fi
          leaks=$(unzip -l "$release_apk" \
            | grep -Ei '(ui-tooling|ui-test-manifest)' \
            | grep -v 'ui-tooling-preview' || true)
          if [ -n "$leaks" ]; then
            echo "::error::Release APK contains debug tooling artifacts"
            echo "$leaks"
            exit 1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
