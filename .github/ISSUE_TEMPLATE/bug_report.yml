name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
      placeholder: Describe what went wrong...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Open the app
        2. Go to Settings
        3. Change language to German
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      description: Device model (e.g., Pixel 8, Samsung Galaxy S24)
      placeholder: Pixel 8
    validations:
      required: true

  - type: input
    id: android-version
    attributes:
      label: Android Version
      description: Android version (e.g., 14, 15)
      placeholder: "15"
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App Version
      description: Office Break version (e.g., 0.6.0)
      placeholder: "0.6.0"
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Logs
      description: Add screenshots, screen recordings, or logcat output if applicable.
    validations:
      required: false
